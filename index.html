<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Résumé</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="resume">
        <div class="container">
          <!-- Contact Info + Avatar -->
          <div class="resume__block">
            <h1 class="contact-info__header">Ruslan Nazarenko</h1>
            <h3 class="contact-info__sub-header">Full-Stack Developer</h3>

            <div class="contact_info_container fh">
              <div class="contact-info__block"></div>

              <div class="contact-info__block contact-info__block--center">
                <img
                  class="contact-info__avatar"
                  src="/assets/Photo.jpeg"
                  alt="Avatar"
                />
              </div>

              <div class="contact-info__block"></div>
            </div>
          </div>

          <!-- Intro -->
          <div class="resume__block">
            <div class="intro">
              <div class="intro__icon-wrapper"></div>
              <p class="intro_text">
                I am a developer passionate about building high-quality web
                applications. I love clean code, modern technologies and
                challenging projects.
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
